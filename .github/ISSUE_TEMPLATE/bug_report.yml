name: Bug 报告
description: 报告一个缺陷（代码、读出协议、校准、评测）
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 命令 / 代码 / 输入样例（请勿包含真实密钥或隐私数据）
      placeholder: |
        jue decide --backend ... --state "..." --questions-file ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "OS / Python 版本 / jue 版本或 commit / 后端与模型"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或输出
      render: text
